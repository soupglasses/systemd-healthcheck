name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        go-version: ['1.22.x', stable]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Check packaging
        run: |
          bash -n packaging/obs/PKGBUILD
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('packaging/obs/_service')"
          test -x packaging/obs/debian.rules

      - name: Build
        env:
          CGO_ENABLED: 0
        run: go build -buildvcs=false -mod=readonly -trimpath -o sd-healthcheck ./cmd/sd-healthcheck
